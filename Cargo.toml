[workspace]
members = [
    "crates/battlement",
    "crates/battlement-builder",
    "crates/battlement-builder-macros",
    "crates/battlement-cloud",
    "crates/battlement-cloud-fake",
    "crates/battlement-ditto",
    "crates/battlement-types",
    "crates/battlement-tooling",
    "crates/battlement-ui",
    "crates/battlement-ui-fake",
    "crates/battlement-fake",
    "crates/battlement-cli",
    "crates/battlement-native",
    "crates/battlement-reactant",
    "crates/battlement-reactant-asset-macros",
    "crates/battlement-reactant-asset-syntax",
    "crates/battlement-reactant-assets",
    "crates/battlement-native/tests/fixtures/exported-engine",
]
exclude = ["samples/basic/rules", "samples/tictactoe/rules"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/thurn/battlement"
rust-version = "1.98.1"

[workspace.dependencies]
battlement-cloud = { path = "crates/battlement-cloud" }
battlement-cloud-fake = { path = "crates/battlement-cloud-fake" }
battlement-ditto = { path = "crates/battlement-ditto" }
battlement-reactant = { path = "crates/battlement-reactant" }
battlement-reactant-asset-syntax = { path = "crates/battlement-reactant-asset-syntax" }
battlement-reactant-assets = { path = "crates/battlement-reactant-assets" }
battlement-tooling = { path = "crates/battlement-tooling" }
battlement-types = { path = "crates/battlement-types" }
battlement-ui = { path = "crates/battlement-ui" }
battlement-ui-fake = { path = "crates/battlement-ui-fake" }
anyhow = "1.0.100"
aws-credential-types = "=1.2.3"
aws-sdk-s3 = "=1.96.0"
aws-smithy-runtime-api = "=1.9.2"
backtrace = "0.3.76"
clap = { version = "4.5.51", features = ["derive"] }
color-backtrace = "0.7.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
enum-kinds = "0.5.1"
enum_dispatch = "0.3.13"
fs2 = "0.4.3"
inventory = "0.3.24"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
toml = "0.9.8"
tiny_http = "0.12.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
trox = "0.1.0"
ureq = "3.4.0"
uuid = { version = "1.18.1", features = ["js", "serde", "v4"] }
