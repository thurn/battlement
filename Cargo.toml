[workspace]
members = ["crates/masonry-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/thurn/masonry"
rust-version = "1.85"

[workspace.dependencies]
schemars = { version = "=1.2.2", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
