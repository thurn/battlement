[workspace]
members = [
    "crates/battlement",
    "crates/battlement-types",
    "crates/battlement-ui",
    "crates/battlement-fake",
    "crates/battlement-cli",
    "crates/battlement-native",
    "crates/battlement-native/tests/fixtures/exported-engine",
]
exclude = ["samples/basic/rules", "samples/tictactoe/rules"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/thurn/battlement"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
backtrace = "0.3.76"
battlement-types = { path = "crates/battlement-types" }
battlement-ui = { path = "crates/battlement-ui" }
clap = { version = "4.5.51", features = ["derive"] }
color-backtrace = "0.7.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
