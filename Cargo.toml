[workspace]
members = [
    "crates/battlement",
    "crates/battlement-fake",
    "crates/battlement-cli",
    "crates/battlement-native",
    "crates/battlement-native/tests/fixtures/exported-engine",
]
exclude = ["samples/basic/rules", "samples/tictactoe/rules"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/thurn/battlement"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
