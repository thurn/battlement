name = "chess"
default_profile = "macos"

[timeouts]
run = "12m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "8s"
scenario_timeout = "60s"
motion = "instant"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
unity_project = "."
scene = "Assets/Scenes/Main.unity"
rust_manifest = "rules/Cargo.toml"

[aliases]
play = "4cf7cb75-ec8f-44ec-88c9-c83ca3869f43"
refresh = "35b288b3-6d72-48af-aeb9-e8f11d63e3ea"
state_title = "43000000-0000-4000-8000-000000000101"
state_initial = "43000000-0000-4000-8000-000000000102"
state_selected = "43000000-0000-4000-8000-000000000103"
state_player_move = "43000000-0000-4000-8000-000000000104"
state_ai_response = "43000000-0000-4000-8000-000000000105"
state_capture = "43000000-0000-4000-8000-000000000106"
state_castle = "43000000-0000-4000-8000-000000000107"
