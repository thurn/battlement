state_promotion = "43000000-0000-4000-8000-000000000109"
state_check = "43000000-0000-4000-8000-000000000110"
state_player_win = "43000000-0000-4000-8000-000000000111"
state_computer_win = "43000000-0000-4000-8000-000000000112"
