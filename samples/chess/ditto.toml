name = "chess"
default_profile = "macos"

[timeouts]
run = "12m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "2s"
scenario_timeout = "10s"
motion = "instant"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
unity_project = "."
scene = "Assets/Scenes/Main.unity"
rust_manifest = "rules/Cargo.toml"

