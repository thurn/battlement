name = "chess"
default_profile = "macos"

[timeouts]
run = "12m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "10s"
motion = "instant"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
reactant = true
unity_project = "."
scene = "Assets/Scenes/Main.unity"
rust_manifest = "rules/Cargo.toml"

[aliases]
play = "4cf7cb75-ec8f-44ec-88c9-c83ca3869f43"
refresh = "35b288b3-6d72-48af-aeb9-e8f11d63e3ea"

[baseline]
kind = "r2"
namespace = "battlement/chess"
public_base_url = "https://pub-e284c2ca25814355bb2c85707405b77c.r2.dev"
account_id_env = "BATTLEMENT_R2_ACCOUNT_ID"
bucket_env = "BATTLEMENT_R2_BUCKET"
access_key_id_env = "BATTLEMENT_R2_ACCESS_KEY_ID"
secret_access_key_env = "BATTLEMENT_R2_SECRET_ACCESS_KEY"

[profiles.macos]
target = "macos"
display = { width = 1280, height = 720, scale = 1.0 }

[[scenarios]]
name = "title"
fixture = "title"

[[scenarios.steps]]
accessibility_assert = { target = { role = "button", name = "Play chess" }, role = "button", name = "Play chess" }

[[scenarios.steps]]
screenshot = { name = "title" }

[[scenarios]]
name = "computer win"
fixture = "computer win"

[[scenarios.steps]]
screenshot = { name = "computer-win" }

[[scenarios]]
name = "resumed board"
fixture = "resumed board"

[[scenarios.steps]]
screenshot = { name = "resumed-board" }
