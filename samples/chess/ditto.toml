name = "chess"
default_profile = "macos"

[timeouts]
run = "12m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "45s"
motion = "instant"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
reactant = true
unity_project = "."
scene = "Assets/Scenes/Main.unity"
rust_manifest = "rules/Cargo.toml"

[baseline]
kind = "r2"
namespace = "battlement/chess"
public_base_url = "https://pub-e284c2ca25814355bb2c85707405b77c.r2.dev"
account_id_env = "BATTLEMENT_R2_ACCOUNT_ID"
bucket_env = "BATTLEMENT_R2_BUCKET"
access_key_id_env = "BATTLEMENT_R2_ACCESS_KEY_ID"
secret_access_key_env = "BATTLEMENT_R2_SECRET_ACCESS_KEY"

[profiles.macos]
target = "macos"
display = { width = 1280, height = 720, scale = 1.0 }

[[scenarios]]
name = "title"
fixture = "title"
motion = "controlled"

[[scenarios.steps]]
accessibility_assert = { target = { role = "button", name = "PLAY" }, role = "button", name = "PLAY" }

[[scenarios.steps]]
screenshot = { name = "title" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "SETTINGS" }, action = "activate" }

[[scenarios.steps]]
screenshot = { name = "settings" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "RETURN" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "PLAY" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "button", name = "Main menu" }, role = "button", name = "Main menu" }

[[scenarios.steps]]
screenshot = { name = "new-game" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "Main menu" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "button", name = "PLAY" }, role = "button", name = "PLAY" }

[[scenarios.steps]]
screenshot = { name = "returned-menu" }

[[scenarios]]
name = "computer win"
fixture = "computer win"

[[scenarios.steps]]
screenshot = { name = "computer-win" }

[[scenarios]]
name = "resumed board"
fixture = "resumed board"

[[scenarios.steps]]
screenshot = { name = "resumed-board" }

[[scenarios]]
name = "semantic pawn selection"
fixture = "title"
motion = "controlled"
[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "PLAY" }, action = "activate" }
[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "⁨White Pawn⁩ at ⁨e2⁩" }, action = "activate" }
[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "Move to ⁨e4⁩" }, action = "activate" }
[[scenarios.steps]]
accessibility_assert = { target = { role = "button", name = "⁨White Pawn⁩ at ⁨e4⁩" }, role = "button", name = "⁨White Pawn⁩ at ⁨e4⁩" }
