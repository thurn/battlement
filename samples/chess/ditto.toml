piece_e2 = "43000000-0000-4000-8100-00000000000c"
piece_d4 = "43000000-0000-4000-8100-00000000001b"
piece_e5 = "43000000-0000-4000-8100-000000000024"
piece_e1 = "43000000-0000-4000-8100-000000000004"
piece_a7 = "43000000-0000-4000-8100-000000000030"
piece_a2 = "43000000-0000-4000-8100-000000000008"
piece_g6 = "43000000-0000-4000-8100-00000000002e"
piece_c7 = "43000000-0000-4000-8100-000000000032"
target_e4 = "43000000-0000-4000-8200-00000000001c"
target_g1 = "43000000-0000-4000-8200-000000000006"
target_d6 = "43000000-0000-4000-8200-00000000002b"
target_a8 = "43000000-0000-4000-8200-000000000038"
target_e2 = "43000000-0000-4000-8200-00000000000c"
target_g7 = "43000000-0000-4000-8200-000000000036"
