[package]
name = "battlement-chess-rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "battlement_rules"
crate-type = ["cdylib", "rlib"]

[dependencies]
battlement = { path = "../../../crates/battlement" }
battlement-cloud = { path = "../../../crates/battlement-cloud" }
reactant = { path = "../../../crates/reactant" }
cozy-chess = "0.3.4"
fastrand = "2.3.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
trox = "0.2.1"

[dev-dependencies]
battlement-fake = { path = "../../../crates/battlement-fake" }

[workspace]

[[test]]
name = "black_box_input"
path = "tests/black_box_input_tests.rs"

[[test]]
name = "black_box_outcomes"
path = "tests/black_box_outcomes_tests.rs"

[[test]]
name = "black_box_services"
path = "tests/black_box_services_tests.rs"
