[package]
name = "masonry-chess-rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "masonry_rules"
crate-type = ["cdylib", "rlib"]

[dependencies]
masonry = { path = "../../../crates/masonry" }
masonry-native = { path = "../../../crates/masonry-native" }
cozy-chess = "0.3.4"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
masonry-fake = { path = "../../../crates/masonry-fake" }

[workspace]
