[package]
name = "battlement-chess-rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "battlement_rules"
crate-type = ["cdylib", "rlib"]

[dependencies]
battlement = { path = "../../../crates/battlement" }
battlement-native = { path = "../../../crates/battlement-native", features = ["threading"] }
cozy-chess = "0.3.4"
fastrand = "2.3.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"

[dev-dependencies]
battlement-fake = { path = "../../../crates/battlement-fake" }

[workspace]
