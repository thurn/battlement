[package]
name = "battlement-chess-rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "chess_rules"
crate-type = ["cdylib", "rlib"]

[dependencies]
battlement = { path = "../../../crates/battlement" }
battlement-cloud = { path = "../../../crates/battlement-cloud" }
reactant = { path = "../../../crates/reactant" }
cozy-chess = "0.3.4"
fastrand = "2.3.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
trox = "0.2.1"

[dev-dependencies]
battlement-fake = { path = "../../../crates/battlement-fake" }
reactant-testing = { path = "../../../crates/reactant-testing", default-features = false }

[workspace]

[[test]]
name = "input"
path = "tests/input_tests.rs"

[[test]]
name = "outcomes"
path = "tests/outcomes_tests.rs"

[[test]]
name = "services"
path = "tests/services_tests.rs"

[[test]]
name = "worker"
path = "tests/worker_tests.rs"

[[test]]
name = "observations"
path = "tests/observations_tests.rs"

[[test]]
name = "performance"
path = "tests/performance_tests.rs"

[[test]]
name = "menu"
path = "tests/menu_tests.rs"

[[test]]
name = "settings"
path = "tests/settings_tests.rs"

[[test]]
name = "localization"
path = "tests/localization_tests.rs"

[[test]]
name = "computer_delay"
path = "tests/computer_delay_tests.rs"

[[test]]
name = "erase_progress"
path = "tests/erase_progress_tests.rs"

[[test]]
name = "bindings"
path = "tests/bindings_tests.rs"

[[test]]
name = "audio"
path = "tests/audio_tests.rs"

[[test]]
name = "motion"
path = "tests/motion_tests.rs"
