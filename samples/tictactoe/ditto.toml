name = "tictactoe"
default_profile = "macos"

[timeouts]
run = "8m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "45s"
motion = "controlled"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
unity_project = "."
scene = "Assets/Scenes/TicTacToe.unity"
rust_manifest = "rules/Cargo.toml"

