name = "chess-ui"
default_profile = "macos"

[timeouts]
run = "8m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "45s"
motion = "controlled"

[performance]
target_fps = 60

[player]
unity_project = "."
scene = "Assets/Scenes/ChessUi.unity"
rust_manifest = "rules/Cargo.toml"

[baseline]
kind = "filesystem"
namespace = "battlement/chess-ui"
root = "baselines"

[profiles.macos]
target = "macos"
display = { width = 1280, height = 800, scale = 1.0 }

[[scenarios]]
name = "native action streaks"

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "ABOUT" }, action = "activate" }

[[scenarios.steps]]
advance = { frames = 6 }

[[scenarios.steps]]
screenshot = { name = "native-streaks", max_changed_percent = 0.01 }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "ABOUT" }, action = "activate" }

[[scenarios.steps]]
advance = { frames = 6 }

[[scenarios.steps]]
screenshot = { name = "native-streaks-repeated", max_changed_percent = 0.01 }

[[scenarios.steps]]
advance = { frames = 60 }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "Mute background music" }, action = "activate" }

[[scenarios.steps]]
screenshot = { name = "native-streaks-finished", max_changed_percent = 0.01 }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "Enable background music" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "SETTINGS" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "checkbox", name = "Reduce Motion" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "RETURN" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "ABOUT" }, action = "activate" }

[[scenarios.steps]]
advance = { frames = 6 }

[[scenarios.steps]]
screenshot = { name = "native-streaks-reduced-motion", max_changed_percent = 0.01 }

[[scenarios]]
name = "complete chess ui"
motion = "controlled"

[[scenarios.steps]]
accessibility_assert = { target = { role = "heading", name = "Chess Chess Revolution" }, role = "heading", name = "Chess Chess Revolution" }

[[scenarios.steps]]
screenshot = { name = "main-menu", max_changed_percent = 0.1 }

[[scenarios.steps]]
accessibility_assert = { target = { role = "button", name = "PLAY" }, role = "button", name = "PLAY" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "SETTINGS" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "heading", name = "Settings" }, role = "heading", name = "Settings" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "Text Size 100%" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "option", name = "200%" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "checkbox", name = "Reduce Motion" }, action = "activate" }

[[scenarios.steps]]
accessibility_action = { target = { role = "tab", name = "Sound" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "slider", name = "Master Volume" }, role = "slider", name = "Master Volume" }

[[scenarios.steps]]
accessibility_action = { target = { role = "tab", name = "Input" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "table", name = "Input bindings" }, role = "table", name = "Input bindings" }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "RETURN" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "heading", name = "Chess Chess Revolution" }, role = "heading", name = "Chess Chess Revolution" }

[[scenarios]]
name = "performance settings navigation"

[[scenarios.steps]]
name = "Open settings"
measure = true
pointer_action = { target = { role = "button", name = "SETTINGS" }, action = "click" }

[[scenarios.steps]]
name = "Open Sound tab"
measure = true
pointer_action = { target = { role = "tab", name = "Sound" }, action = "click" }

[[scenarios.steps]]
name = "Open Input tab"
measure = true
pointer_action = { target = { role = "tab", name = "Input" }, action = "click" }

[[scenarios.steps]]
name = "Open Graphics tab"
measure = true
pointer_action = { target = { role = "tab", name = "Graphics" }, action = "click" }

[[scenarios.steps]]
name = "Return to main menu"
measure = true
pointer_action = { target = { role = "button", name = "RETURN" }, action = "click" }

[[scenarios]]
name = "settings route transition"

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "SETTINGS" }, action = "activate" }

[[scenarios.steps]]
screenshot = { name = "settings", max_changed_percent = 0.1 }

[[scenarios.steps]]
accessibility_action = { target = { role = "button", name = "RETURN" }, action = "activate" }

[[scenarios.steps]]
accessibility_assert = { target = { role = "heading", name = "Chess Chess Revolution" }, role = "heading", name = "Chess Chess Revolution" }
