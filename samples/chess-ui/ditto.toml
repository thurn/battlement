name = "chess-ui"
default_profile = "macos"

[timeouts]
run = "8m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "45s"
motion = "controlled"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
unity_project = "."
scene = "Assets/Scenes/ChessUi.unity"
rust_manifest = "rules/Cargo.toml"

[baseline]
kind = "r2"
namespace = "battlement/chess-ui"
public_base_url = "https://pub-e284c2ca25814355bb2c85707405b77c.r2.dev"
account_id_env = "BATTLEMENT_R2_ACCOUNT_ID"
bucket_env = "BATTLEMENT_R2_BUCKET"
access_key_id_env = "BATTLEMENT_R2_ACCESS_KEY_ID"
secret_access_key_env = "BATTLEMENT_R2_SECRET_ACCESS_KEY"

[profiles.macos]
target = "macos"
display = { width = 1280, height = 800, scale = 1.0 }

[profiles.design]
target = "macos"
display = { width = 1440, height = 1584, scale = 1.0 }

