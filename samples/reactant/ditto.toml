name = "reactant"
default_profile = "macos"

[timeouts]
run = "8m"
build = "15m"
launch = "90s"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "45s"
motion = "controlled"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
unity_project = "."
scene = "Assets/Scenes/ReactantSample.unity"
rust_manifest = "rules/Cargo.toml"

[aliases]
root = "25300000-0000-4000-8000-000000000004"

[baseline]
kind = "r2"
namespace = "battlement/reactant"
public_base_url = "https://pub-e284c2ca25814355bb2c85707405b77c.r2.dev"
account_id_env = "BATTLEMENT_R2_ACCOUNT_ID"
bucket_env = "BATTLEMENT_R2_BUCKET"
access_key_id_env = "BATTLEMENT_R2_ACCESS_KEY_ID"
secret_access_key_env = "BATTLEMENT_R2_SECRET_ACCESS_KEY"

[profiles.macos]
target = "macos"
display = { width = 1280, height = 720, scale = 1.0 }

[[scenarios]]
name = "composition"

[[scenarios.steps]]
wait = { object = "root", state = "visible" }

[[scenarios.steps]]
screenshot = { name = "initial" }
