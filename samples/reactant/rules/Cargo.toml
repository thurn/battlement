[package]
name = "battlement-reactant-rules"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "battlement_rules"
crate-type = ["cdylib", "rlib"]

[dependencies]
battlement = { path = "../../../crates/battlement" }
reactant = { path = "../../../crates/reactant" }
futures-channel = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ron = "0.11.0"
trox = "0.2.1"

[dev-dependencies]
battlement-fake = { path = "../../../crates/battlement-fake" }
reactant-testing = { path = "../../../crates/reactant-testing", default-features = false }

[workspace]
