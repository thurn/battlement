# Browser risks select local compatibility checks independently of public review.
[[risks]]
paths = ["web/init.js", "Packages/com.battlement.client/Runtime/*.jslib"]
reason = "Browser startup, input, or JavaScript bridge behavior"
samples = ["basic"]

[[risks]]
paths = ["Packages/com.battlement.client/Runtime/*.shader", "Packages/com.battlement.client/Runtime/*.hlsl", "Packages/com.battlement.client/Runtime/*.shadergraph", "samples/*/*.shader", "samples/*/*.hlsl", "samples/*/*.shadergraph"]
reason = "Shader behavior can differ under WebGL"
samples = ["ui"]

[[risks]]
paths = ["Packages/com.battlement.client/Runtime/UI/BattlementPaint*.cs", "Packages/com.battlement.client/Runtime/UI/BattlementRadialGradientRaster.cs", "Packages/com.battlement.client/Runtime/UI/Resources/BattlementPanelSettingsTemplate.asset"]
reason = "Paint geometry and browser worker scheduling"
samples = ["chess"]

[[risks]]
paths = ["Packages/com.battlement.client/Editor/BattlementSampleBuild.cs"]
reason = "Web player construction"
samples = ["basic"]

[[risks]]
paths = ["scripts/serve_web.py"]
reason = "Cross-origin isolation headers and encoded asset serving"
kind = "fixture"

[[risks]]
paths = ["Packages/com.battlement.client/Runtime/Host/BattlementHostSettings.cs"]
reason = "Browser keyboard evidence and host capability observation"
samples = ["basic"]

[[risks]]
paths = ["crates/reactant-rules/src/computation.rs", "crates/reactant-rules/src/worker.rs", "crates/reactant-rules/src/worker_observer.rs", "crates/reactant-rules/src/platform_proof.rs", "scripts/webgl_worker_proof.py", "fixtures/webgl-worker-proof/*"]
reason = "Cooperative computation cleanup and latest-only replacement under a finite WebGL worker pool"
kind = "worker"

[[risks]]
paths = ["samples/chess/rules/src/settings/audio.rs", "samples/chess/rules/src/menu/background_music.rs", "samples/chess/rules/src/menu/sound_settings.rs", "crates/reactant-core/src/audio.rs", "crates/reactant-core/src/audio_playback.rs", "Packages/com.battlement.client/Runtime/Host/BattlementAudio*.cs"]
reason = "Chess browser startup and settings compatibility with audio-host changes"
samples = ["chess"]

[[risks]]
paths = ["crates/reactant/src/persistence*.rs", "crates/battlement-native/src/browser_persistence.rs", "Packages/com.battlement.client/Runtime/BattlementPersistence.jslib", "samples/hearts/rules/examples/browser_persistence*", "samples/hearts/rules/src/saved_game.rs", "samples/hearts/rules/src/domain/*", "fixtures/browser-persistence/*", "scripts/browser_persistence_proof.py", "web/checks/persistence.js"]
