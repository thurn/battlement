version = 1

[remote]
enabled = true

[[step]]
name = "ci"
run = "rustup run 1.98.1 python3 scripts/ci.py --full --tollgate-evidence"
timeout = "1h"
semaphores = ["unity"]
artifact = [
  { name = "ditto-evidence", patterns = ["artifacts/tollgate-ditto/{{buildset_id}}/evidence.tar.gz"], required = true },
]
