name = "mobile-worker-proof"
default_profile = "ios-simulator"

[timeouts]
run = "5m"
build = "30m"
launch = "2m"
baseline_download = "2m"

[defaults]
step_timeout = "5s"
scenario_timeout = "30s"
motion = "controlled"

[defaults.comparison]
threshold = 0.1
anti_alias = true
max_changed_percent = 0.01

[player]
unity_project = "../.."
scene = "../../Assets/BattlementWebglWorkerProof/BattlementWebglWorkerProof.unity"
rust_manifest = "../../crates/battlement-native/tests/fixtures/exported-engine/Cargo.toml"

[profiles.ios-simulator]
target = "ios-simulator"
device = "iPhone 17"
orientation = "landscape-left"

[[scenarios]]
name = "worker cancellation"

[[scenarios.steps]]
advance = { frames = 1 }
