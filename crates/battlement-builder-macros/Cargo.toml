[package]
name = "battlement-builder-macros"
version = "0.1.0"
description = "Attribute macro for same-struct builders"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = { version = "2.0.110", features = ["full", "visit", "visit-mut"] }
