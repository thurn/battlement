[package]
name = "battlement-reactant-assets"
version = "0.1.0"
description = "Host tooling for Reactant generated assets"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
battlement-reactant-asset-syntax.workspace = true
bytes = "1.12.1"
fs2 = "0.4.3"
nix = { version = "0.30.1", features = ["process", "signal"] }
png = "0.18.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.27.0"
tungstenite = "0.30.0"
ttf-parser = "0.25.1"
woff2-patched = "0.4.0"
