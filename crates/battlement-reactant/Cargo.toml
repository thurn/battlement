[package]
name = "battlement-reactant"
version = "0.1.0"
description = "Declarative Battlement UI runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
battlement = { path = "../battlement" }
battlement-builder = { path = "../battlement-builder" }
battlement-flatbuffers = { path = "../battlement-flatbuffers" }
battlement-native = { path = "../battlement-native" }
battlement-reactant-asset-macros = { path = "../battlement-reactant-asset-macros" }
inventory.workspace = true
trox.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
battlement-fake = { path = "../battlement-fake" }
battlement-flatbuffers = { path = "../battlement-flatbuffers", features = ["test-support"] }
serde_json.workspace = true
