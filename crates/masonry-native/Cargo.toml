[package]
name = "masonry-native"
version = "0.1.0"
description = "Reusable native adapter for Masonry rules engines"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
threading = ["dep:rayon"]

[dependencies]
masonry = { path = "../masonry" }
rayon = { version = "1.12.0", optional = true }
serde.workspace = true

[dev-dependencies]
libloading = "0.8.9"
